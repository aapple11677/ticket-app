<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>票務代搶登記系統</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        div { margin-bottom: 10px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>新增代搶訂單</h2>
    
    <div><label>活動名稱:</label><input type="text" id="eventName" placeholder="例如：Post Malone 高雄場"></div>
    <div><label>搶票日期時間:</label><input type="datetime-local" id="ticketDate"></div>
    <div><label>客戶聯絡人 (平台):</label><input type="text" id="contactInfo" placeholder="例如：LINE - 王小明"></div>
    <div><label>需求明細:</label><input type="text" id="ticketDetails" placeholder="例如：搖滾區 2張"></div>
    <div><label>購票平台帳密:</label><input type="text" id="accountPassword" placeholder="例如：FB登入 test@email.com / 密碼123"></div>
    <div><label>信用卡後6碼:</label><input type="text" id="creditCard" placeholder="例如：123456"></div>
    
    <button onclick="submitOrder()">送出訂單</button>
    <hr style="margin: 30px 0;">
    <h2>任務行事曆</h2>
    <div id='calendar'></div>
    <script>
        async function submitOrder() {
            const data = {
                event_name: document.getElementById('eventName').value,
                ticket_date: document.getElementById('ticketDate').value + ":00",
                contact_info: document.getElementById('contactInfo').value,
                ticket_details: document.getElementById('ticketDetails').value,
                account_password: document.getElementById('accountPassword').value,
                credit_card_last_digits: document.getElementById('creditCard').value
            };

            try {
                // 將資料發送到我們剛建立好的 FastAPI 伺服器
                const response = await fetch("/api/proxy-orders/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    alert("成功！ " + result.message);
                } else {
                    alert("發生錯誤，請檢查資料格式。");
                }
            } catch (error) {
                alert("無法連線到伺服器，請確認 uvicorn 是否有在執行。");
            }
        }
        // ==========================================
// ★ 從這裡開始貼上行事曆初始化程式碼
// ==========================================
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        events: '/api/proxy-orders/', // 讓行事曆自動去呼叫我們寫好的後端 API
        eventClick: function(info) {
    // 1. 先跳出確認視窗，顯示目前資訊
    var action = confirm(
        "🎟 活動：" + info.event.title + "\n" +
        "👤 聯絡人：" + info.event.extendedProps.contact + "\n" +
        "📝 需求與領票資訊：" + info.event.extendedProps.details + "\n" +
        "📌 狀態：" + info.event.extendedProps.status + "\n\n" +
        "👉 點擊「確定」來修改狀態與領票資訊，或點擊「取消」關閉。"
    );

    // 2. 如果使用者點擊確定，就跳出輸入框讓他修改
    if (action) {
        var newStatus = prompt("請輸入新狀態：", info.event.extendedProps.status);
        var newDetails = prompt("請輸入最新領票資訊或需求修改：", info.event.extendedProps.details);

        // 3. 如果輸入不為空，就將新資料送到後端 API
        if (newStatus !== null && newDetails !== null) {
            fetch('/api/proxy-orders/' + info.event.id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    order_status: newStatus, 
                    ticket_details: newDetails 
                })
            }).then(response => {
                if(response.ok) {
                    alert("更新成功！");
                    info.view.calendar.refetchEvents(); // 讓行事曆重新抓取最新資料
                }
            });
        }
    }
}
    });
    calendar.render();
});
// ==========================================
    </script>
</body>
</html>
